name: Tag plugin release

# Devadigm Testimonials checks this repository's tags for updates (see
# devadigm-testimonials/includes/class-updater.php) so the WordPress site can
# update the plugin from Plugins > Update now instead of a hand-uploaded zip.
# This workflow is what keeps that meaningful: every push to the default
# branch that carries a new plugin Version bump gets tagged automatically,
# with no separate release step to remember.
on:
  push:
    branches: [ claude/testimonials-plugin-designs-urcnvt ]
    paths:
      - devadigm-testimonials/devadigm-testimonials.php
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          version=$(grep -oP "const VERSION\s*=\s*'\K[^']+" devadigm-testimonials/devadigm-testimonials.php)
          if [ -z "$version" ]; then
            echo "Could not find the VERSION constant." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag it, unless that version is already tagged
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Devadigm Testimonials $tag"
          git push origin "$tag"
